name: Publish production template

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: network-monitoring-354214
  BUCKET_NAME: new-relic-dataflow-templates
  REGION: us-east1

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish PubsubToNewRelic template
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 8
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Backup existing template
        run: |
          BACKUP_TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
          echo "BACKUP_TIMESTAMP=${BACKUP_TIMESTAMP}" >> "$GITHUB_ENV"

          echo "Creating backup of existing template..."
          gcloud storage cp "gs://${BUCKET_NAME}/template/PubSubToNewRelic" \
            "gs://${BUCKET_NAME}/template/backups/${BACKUP_TIMESTAMP}/PubSubToNewRelic"

          echo "Backup completed: gs://${BUCKET_NAME}/template/backups/${BACKUP_TIMESTAMP}/"

      - name: Build and publish template
        run: |
          mvn compile exec:java \
            -Dexec.mainClass=com.google.cloud.teleport.templates.PubsubToNewRelic \
            -Dexec.cleanupDaemonThreads=false \
            -Dexec.args=" \
              --project=${PROJECT_ID} \
              --region=${REGION} \
              --enableStreamingEngine \
              --stagingLocation=gs://${BUCKET_NAME}/staging/ \
              --gcpTempLocation=gs://${BUCKET_NAME}/temp/ \
              --templateLocation=gs://${BUCKET_NAME}/template/PubSubToNewRelic \
              --runner=DataflowRunner \
            "

      - name: Summary
        run: |
          echo "Template published to: gs://${BUCKET_NAME}/template/PubSubToNewRelic"
          echo "Backup saved to: gs://${BUCKET_NAME}/template/backups/${BACKUP_TIMESTAMP}/"
